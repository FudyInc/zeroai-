<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="zero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="640" fill="url(#bg)"/>
  <text x="40" y="52" fill="#f8fafc" font-size="26" font-weight="700">ZERO</text>
  <text x="112" y="52" fill="#94a3b8" font-size="16">· orquestador multi-agente de lead-gen B2B</text>
  <text x="40" y="76" fill="#64748b" font-size="13">Todos los agentes hablan el mismo contrato JSON · el backend se intercambia sin tocar prompts</text>

  <!-- Pipeline ribbon -->
  <g font-size="13" fill="#cbd5e1">
    <text x="40" y="118" fill="#7dd3fc" font-size="12" font-weight="600" letter-spacing="1">PIPELINE</text>
    <g transform="translate(40,130)">
      <g>
        <rect x="0"   y="0" width="118" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="59"  y="22" text-anchor="middle">discover</text>
        <rect x="142" y="0" width="118" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="201" y="22" text-anchor="middle">qualify</text>
        <rect x="284" y="0" width="118" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="343" y="22" text-anchor="middle">validate</text>
        <rect x="426" y="0" width="118" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="485" y="22" text-anchor="middle">outreach</text>
        <rect x="568" y="0" width="128" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="632" y="22" text-anchor="middle">follow-up</text>
        <rect x="722" y="0" width="118" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="781" y="22" text-anchor="middle">forecast</text>
      </g>
      <g stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
        <line x1="118" y1="17" x2="140" y2="17"/>
        <line x1="260" y1="17" x2="282" y2="17"/>
        <line x1="402" y1="17" x2="424" y2="17"/>
        <line x1="544" y1="17" x2="566" y2="17"/>
        <line x1="696" y1="17" x2="720" y2="17"/>
      </g>
    </g>
  </g>

  <!-- ZERO core -->
  <g>
    <rect x="380" y="210" width="200" height="74" rx="14" fill="url(#zero)" filter="url(#glow)"/>
    <text x="480" y="245" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">ZERO</text>
    <text x="480" y="268" text-anchor="middle" fill="#e0e7ff" font-size="12">orquestador · Opus 4.8 · lógica Python</text>
  </g>

  <!-- Agents -->
  <g font-size="14" font-weight="600">
    <g>
      <rect x="40"  y="350" width="160" height="70" rx="12" fill="#0b3b2e" stroke="#10b981"/>
      <text x="120" y="382" text-anchor="middle" fill="#6ee7b7">PROSPECTOR</text>
      <text x="120" y="402" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="400">descubre + enriquece</text>
    </g>
    <g>
      <rect x="216" y="350" width="160" height="70" rx="12" fill="#0b2f4a" stroke="#38bdf8"/>
      <text x="296" y="382" text-anchor="middle" fill="#7dd3fc">QUALIFIER</text>
      <text x="296" y="402" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="400">score ICP 0-100</text>
    </g>
    <g>
      <rect x="392" y="350" width="160" height="70" rx="12" fill="#3a2a0b" stroke="#f59e0b"/>
      <text x="472" y="382" text-anchor="middle" fill="#fcd34d">OUTREACH</text>
      <text x="472" y="402" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="400">primer toque</text>
    </g>
    <g>
      <rect x="568" y="350" width="160" height="70" rx="12" fill="#3a0b2e" stroke="#ec4899"/>
      <text x="648" y="382" text-anchor="middle" fill="#f9a8d4">TRACKER</text>
      <text x="648" y="402" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="400">cadencia follow-up</text>
    </g>
    <g>
      <rect x="744" y="350" width="160" height="70" rx="12" fill="#241b3a" stroke="#a78bfa"/>
      <text x="824" y="382" text-anchor="middle" fill="#c4b5fd">ANALYST</text>
      <text x="824" y="402" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="400">forecast (math en Py)</text>
    </g>
  </g>

  <!-- dispatch links ZERO -> agents -->
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3">
    <path d="M430,284 C300,310 160,320 120,348"/>
    <path d="M455,284 C380,312 320,322 296,348"/>
    <path d="M480,286 L472,348"/>
    <path d="M505,284 C580,312 620,322 648,348"/>
    <path d="M550,284 C700,310 800,320 824,348"/>
  </g>
  <text x="600" y="305" fill="#475569" font-size="11" font-style="italic">dispatch JSON ↕ respuesta JSON</text>

  <!-- Gate -->
  <g>
    <rect x="216" y="452" width="336" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="384" y="475" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Gate de lead calificado</text>
    <text x="384" y="495" text-anchor="middle" fill="#94a3b8" font-size="11">contacto verificado · score ≥ 70 · no excluido · no recontactado &lt;90d</text>
  </g>

  <!-- Backends + Discovery -->
  <g font-size="12">
    <text x="40" y="474" fill="#7dd3fc" font-size="12" font-weight="600" letter-spacing="1">BACKEND LLM</text>
    <rect x="40" y="484" width="150" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="50" y="501" fill="#cbd5e1">mock · local · anthropic</text>

    <text x="600" y="474" fill="#7dd3fc" font-size="12" font-weight="600" letter-spacing="1">DISCOVERY</text>
    <rect x="600" y="484" width="304" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="610" y="501" fill="#cbd5e1">DuckDuckGo (sin key) · proveedor con key (futuro)</text>
  </g>

  <!-- Memory -->
  <g>
    <rect x="40" y="545" width="864" height="58" rx="10" fill="#0b1220" stroke="#1f2937"/>
    <text x="60" y="568" fill="#7dd3fc" font-size="12" font-weight="600" letter-spacing="1">MEMORIA DE SESIÓN  (state.json)</text>
    <text x="60" y="589" fill="#94a3b8" font-size="11">clientes · estado por etapa · secuencias de follow-up · contactados · log de auditoría · handoff de contexto</text>
  </g>
</svg>
